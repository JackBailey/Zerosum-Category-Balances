name: Release

on:
    push:
        branches:
            - main

permissions:
    contents: write
    issues: write
    pull-requests: write

jobs:
    release:
        name: Release
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: pnpm/action-setup@v4
              with:
                  version: 11.28.2

            - uses: actions/setup-node@v4
              with:
                  node-version: 24

            - run: pnpm install --frozen-lockfile

            - name: Create semantic release
              id: release
              run: pnpm release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Pack extension
              if: ${{ steps.release.outputs.version != '' }}
              uses: cardinalby/webext-buildtools-pack-extension-dir-action@v1
              with:
                  extensionDir: src
                  zipFilePath: build/source.zip

            - name: Build Chrome release files
              if: ${{ steps.release.outputs.version != '' }}
              uses: cardinalby/webext-buildtools-chrome-crx-action@v2
              with:
                  zipFilePath: build/source.zip
                  crxFilePath: build/zerosum-category-balances.crx
                  privateKey: ${{ secrets.CHROME_CRX_PRIVATE_KEY }}
                  updateXmlPath: build/zerosum-category-balances.xml
                  updateXmlCodebaseUrl: https://github.com/JackBailey/Zerosum-Category-Balances/releases/latest/download/zerosum-category-balances.crx

            - name: Package CRX for download
              if: ${{ steps.release.outputs.version != '' }}
              run: zip -j build/zerosum-category-balances.zip build/zerosum-category-balances.crx

            - name: Publish release assets
              if: ${{ steps.release.outputs.version != '' }}
              run: gh release upload "v${{ steps.release.outputs.version }}" build/zerosum-category-balances.zip build/zerosum-category-balances.crx build/zerosum-category-balances.xml
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
