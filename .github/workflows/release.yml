name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create release pull request
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Pack extension
        if: ${{ steps.release.outputs.release_created }}
        uses: cardinalby/webext-buildtools-pack-extension-dir-action@v1
        with:
          extensionDir: src
          zipFilePath: build/source.zip

      - name: Build Chrome release files
        if: ${{ steps.release.outputs.release_created }}
        uses: cardinalby/webext-buildtools-chrome-crx-action@v2
        with:
          zipFilePath: build/source.zip
          crxFilePath: build/extension.crx
          privateKey: ${{ secrets.CHROME_CRX_PRIVATE_KEY }}
          updateXmlPath: build/extension.xml
          updateXmlCodebaseUrl: https://github.com/JackBailey/Zerosum-Category-Balances/releases/latest/download/extension.crx

      - name: Package CRX for download
        if: ${{ steps.release.outputs.release_created }}
        run: zip -j build/extension.zip build/extension.crx

      - name: Publish release assets
        if: ${{ steps.release.outputs.release_created }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag_name }}
          files: |
            build/extension.zip
            build/extension.crx
            build/extension.xml
