<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="color-scheme" content="dark light" />
        <link rel="stylesheet" href="options.css" />
    </head>
    <body>
        <header class="toolbar">
            <label for="budget-id">Budget</label>
            <select id="budget-id"></select>
            <label for="default-group">Default group</label>
            <select id="default-group"></select>
            <button id="create-group" type="button">New group</button>
        </header>

        <section class="config-section">
            <h2>Configuration</h2>
            <button id="copy-config" type="button">Copy JSON</button>
            <label for="gist-url">Cloud saving (Gist URL)</label>
            <input id="gist-url" type="url" placeholder="https://gist.github.com/..." />
            <label for="gist-token">OpenGist access token</label>
            <input id="gist-token" type="password" placeholder="og_..." autocomplete="off" />
            <button id="use-gist" type="button">Use Gist</button>
            <p id="config-status" role="status"></p>
        </section>

        <section>
            <h2>Account groups</h2>
            <div id="account-groups" class="group-list"></div>
        </section>

        <section>
            <h2>Accounts</h2>
            <div id="accounts"></div>
        </section>

        <section>
            <h2>Categories</h2>
            <div id="categories"></div>
        </section>

        <script src="options.js"></script>
    </body>
</html>
