<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="color-scheme" content="dark light">
        <link rel="stylesheet" href="options.css">
    </head>
    <body>
        <header class="toolbar">
            <label for="budget-id">Budget</label>
            <select id="budget-id"></select>
            <label for="default-group">Default group</label>
            <select id="default-group"></select>
            <button id="create-group" type="button">New group</button>
        </header>

        <section class="config-section">
            <h2>Configuration</h2>
            <button id="copy-config" type="button">Copy JSON</button>

            <fieldset>
                <legend>Gist Raw URL</legend>
                <label for="gist-raw-url">Raw URL</label>
                <input
                    id="gist-raw-url"
                    type="url"
                    placeholder="https://gist.githubusercontent.com/.../raw/..."
                >
                <button id="load-raw-gist" type="button">Load raw Gist</button>
                <p class="help-text">
                    Read-only. Changes are not saved automatically; use Copy
                    JSON to update the Gist manually.
                </p>
            </fieldset>

            <fieldset>
                <legend>OpenGist</legend>
                <label for="opengist-url">OpenGist Endpoint</label>
                <input
                    id="opengist-url"
                    type="url"
                    placeholder="https://opengist.io"
                    required
                >
                <label for="opengist-token">Access token</label>
                <input
                    id="opengist-token"
                    type="password"
                    placeholder="og_..."
                    autocomplete="off"
                >
                <button id="load-opengist-gists" type="button">
                    Load gists
                </button>
                <label for="opengist-gist">Gist</label>
                <select id="opengist-gist" disabled>
                    <option value="">Load gists first</option>
                </select>
                <label for="opengist-file">File</label>
                <select id="opengist-file" disabled>
                    <option value="">Select a Gist first</option>
                </select>
                <button id="use-opengist" type="button" disabled>
                    Use selected file
                </button>
                <p class="help-text">
                    Changes are saved automatically to the selected OpenGist
                    file.
                </p>
            </fieldset>

            <p id="config-status" role="status"></p>
        </section>

        <section>
            <h2>Account groups</h2>
            <div id="account-groups" class="group-list"></div>
        </section>

        <section>
            <h2>Accounts</h2>
            <div id="accounts"></div>
        </section>

        <section>
            <h2>Categories</h2>
            <div id="categories"></div>
        </section>

        <script src="options.js"></script>
    </body>
</html>
